databaseChangeLog:
  - changeSet:
      id: create-payment-table
      author: Farid Calalov
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: student_id
                  type: VARCHAR (7)
                  constraints:
                    nullable: false

              - column:
                  name: pan
                  type: varchar (16)
                  constraints:
                    nullable: false

              - column:
                  name: paid_amount
                  type: DECIMAL(10,2)

              - column:
                  name: payment_status
                  type: VARCHAR(50)
                  defaultValue: UNPAID

              - column:
                  name: payment_id
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: payment_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false